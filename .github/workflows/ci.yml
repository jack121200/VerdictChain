name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with ARG PNPM_VERSION in frontend/Dockerfile (frontend/package.json has no "packageManager").
  PNPM_VERSION: "12.3.4"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: verdictchain
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdictchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # test_infra.py opens a real AMQP connection, so this one is needed.
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: verdictchain
          RABBITMQ_DEFAULT_PASS: ci_password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    # No real secret here: every LLM call in the suite is mocked or stubbed, and JWT_SECRET_KEY is a
    # disposable CI-only value (SKILL-security.md's ".env only" rule is about real secrets).
    # The suite TRUNCATEs its tables and refuses to run on a database called `verdictchain` or one without
    # "test" in its name (backend/tests/fixtures/dbguard.py), so it gets its own database, created below.
    env:
      ENVIRONMENT: development
      LOCAL_DATABASE_URL: postgresql+psycopg://verdictchain:ci_password@localhost:5432/verdictchain_test
      TEST_DATABASE_URL: postgresql+psycopg://verdictchain:ci_password@localhost:5432/verdictchain_test
      DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://verdictchain:ci_password@localhost:5672/
      JWT_SECRET_KEY: ci_only_disposable_secret_not_real
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      # Python 3.12 is a floor, not a preference: backend/api/routes/system.py uses PEP 695 syntax.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          # pandas is imported by backend/pipeline/{ingestion,cert_ingestion,cert_features}.py and by their
          # tests at collection time, but backend/requirements.txt does not list it. Remove this line once it does.
          pip install pandas==3.0.1

      - name: Lint (black --check)
        run: python -m black --line-length 110 backend --check

      - name: Lint (ruff)
        run: python -m ruff check backend --line-length 110

      - name: Create the test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://verdictchain:ci_password@localhost:5432/postgres", autocommit=True) as conn:
              conn.execute("CREATE DATABASE verdictchain_test")
          PY

      # backend/tests/conftest.py runs this too; doing it here gives a readable error if a migration is broken.
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      # -ra lists every skipped test with its reason. The CICIDS2017 / CERT r4.2 datasets are not in git, so
      # the tests that need them skip here; they run on a machine that has the data.
      - name: Run tests
        run: python -m pytest -q -ra -p no:cacheprovider backend/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: No-bluff check
        working-directory: frontend
        run: pnpm check:no-bluff

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: pnpm test

  # Frontend types vs the REAL API: starts the backend with the offline LLM stub (no provider call, no key),
  # registers a throwaway analyst, and runs frontend/scripts/contract-check.mjs against it.
  contract:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: verdictchain
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: verdictchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdictchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No RabbitMQ: the API only probes it for reachability (GET /system/status reports it as down, not as an error).

    env:
      ENVIRONMENT: development
      LOCAL_DATABASE_URL: postgresql+psycopg://verdictchain:ci_password@localhost:5432/verdictchain
      DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci_only_disposable_secret_not_real
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # One step on purpose: the background server lives and dies with it, and its log is printed on failure.
      - name: Contract check against the stub API
        env:
          API_BASE: http://127.0.0.1:8000
          CONTRACT_USER: contract_ci
        run: |
          set -euo pipefail
          python -m backend.scripts.e2e_server --port 8000 > e2e_server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS "$API_BASE/health" > /dev/null 2>&1; then break; fi
            if [ "$attempt" = 60 ]; then echo "API never became healthy"; cat e2e_server.log; exit 1; fi
            sleep 1
          done

          CONTRACT_PASSWORD="$(openssl rand -hex 16)"
          export CONTRACT_PASSWORD
          curl -fsS -X POST "$API_BASE/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"$CONTRACT_USER\", \"password\": \"$CONTRACT_PASSWORD\"}" > /dev/null

          cd frontend
          node scripts/contract-check.mjs || { status=$?; echo "--- API log ---"; cat ../e2e_server.log; exit "$status"; }

  # The browser end-to-end suite (Playwright) against its own stack: the real API with the offline LLM stub on
  # port 8100 and the Vite dev server on 5190, in the database verdictchain_test_pw and Redis db 7. No provider key
  # is set, so the suite costs nothing. See frontend/e2e/support/stack.mjs.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: verdictchain
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: verdictchain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verdictchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      LOCAL_DATABASE_URL: postgresql+psycopg://verdictchain:ci_password@localhost:5432/verdictchain
      E2E_DATABASE_URL: postgresql+psycopg://verdictchain:ci_password@localhost:5432/verdictchain_test_pw
      E2E_REDIS_URL: redis://localhost:6379/7
      DATABASE_URL: ""
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci_only_disposable_secret_not_real
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: frontend
        run: pnpm e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/e2e/.results
          retention-days: 7
