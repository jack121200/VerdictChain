services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host 5433: a native PostgreSQL service already owns 5432 on this machine
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---- The app itself (profile "app"). `docker compose up -d` still starts only the three services above;
  # ---- `docker compose --profile app up -d --build` adds these two. Both bind to loopback only.
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Always the local stack here: the app profile talks to the compose Postgres, never to a hosted DATABASE_URL.
      ENVIRONMENT: development
      # In-network hostnames and container ports. The host-side URLs in .env (127.0.0.1:5433 ...) cannot
      # be reached from inside a container, so these three are built from the same credentials instead.
      LOCAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      DEBATE_DAILY_LIMIT_USER: ${DEBATE_DAILY_LIMIT_USER:-10}
      DEBATE_DAILY_LIMIT_GLOBAL: ${DEBATE_DAILY_LIMIT_GLOBAL:-20}
      BOOTSTRAP_LEAD_USERNAME: ${BOOTSTRAP_LEAD_USERNAME:-}
      BOOTSTRAP_LEAD_PASSWORD: ${BOOTSTRAP_LEAD_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # python is in the image; curl is not.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        # Compiled into the bundle: this is the address the BROWSER uses to reach the API.
        VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
